server {
    listen 9000;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: 所有路由返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
